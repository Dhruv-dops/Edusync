<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>EduSync Certificate</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6fb;
}

.certificate{
    max-width:900px;
    margin:50px auto;
    background:white;
    padding:60px;
    border:12px solid #0d6efd;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.title{
    font-size:48px;
    font-weight:bold;
    color:#0d6efd;
}

.subtitle{
    font-size:20px;
    color:#666;
}

.student{
    font-size:42px;
    font-weight:bold;
    margin:30px 0;
}

.course{
    font-size:30px;
    color:#198754;
    font-weight:bold;
}

.info{
    margin-top:30px;
    font-size:18px;
}

</style>

</head>

<body>

<div class="certificate">

    <h1 class="title">
        EDUSYNC INDIA
    </h1>

    <h2>CERTIFICATE OF COMPLETION</h2>

    <p class="subtitle">
        This certificate is proudly presented to
    </p>

    <div class="student"
         th:text="${cert.userName}">
        Student Name
    </div>

    <p>
        For successfully completing
    </p>

    <div class="course"
         th:text="${cert.courseName}">
        Course Name
    </div>

    <div class="info">

        <p>
            Score:
            <span th:text="${cert.score}"></span>/10
        </p>

        <p>
            Certificate No:
            <span th:text="${cert.certificateNo}"></span>
        </p>

        <p>
            Issue Date:
            <span th:text="${cert.issueDate}"></span>
        </p>

    </div>

    <br>

    <button onclick="window.print()"
            class="btn btn-success">
        Download / Print Certificate
    </button>

</div>

</body>
</html>
