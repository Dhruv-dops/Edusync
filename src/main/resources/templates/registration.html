<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
    background: #f1f3f5;
}

.register-card {
    width: 500px;
    margin: 40px auto;
    background: white;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.logo {
    text-align: center;
    margin-bottom: 20px;
}

.logo h1 {
    font-size: 20px;
    display: inline;
    margin-left: 10px;
}

.form-control {
    height: 50px;
}

.register-btn {
    width: 100%;
    height: 55px;
    background: #212529;
    color: white;
    border: none;
    border-radius: 10px;
    transition: 0.3s;
}

.register-btn:hover {
    transform: scale(1.02);
}

.login-link {
    text-align: center;
    margin-top: 20px;
}

.error-message {
    color: #dc3545;
    font-size: 13px;
    margin-top: 5px;
    display: none;
}

.form-control.error {
    border: 1px solid #dc3545;
    box-shadow: 0 0 0 0.15rem rgba(220, 53, 69, 0.1);
}

.form-control.success {
    border: 1px solid #198754;
}

.password-hint {
    font-size: 12px;
    color: #6c757d;
    margin-top: 5px;
}

</style>

</head>

<body>

<div class="register-card">

    <div class="logo">

        <img
            width="45"
            src="https://img.icons8.com/fluency-systems-filled/48/1b4d89/layers.png"
        >

        <h1>EduSync</h1>

    </div>


    <h2 class="text-center mb-2">
        Create Account
    </h2>


    <p class="text-center text-secondary mb-4">
        Join EduSync and start learning today
    </p>
    
     <div
    th:if="${successMessage}"
    class="alert alert-success"
    th:text="${successMessage}">
</div>

<div
    th:if="${failedMessage}"
    class="alert alert-danger"
    th:text="${failedMessage}">
</div>


    <form
        action="/regForm"
        method="post"
        th:object="${user}"
        onsubmit="return validateForm()"
        novalidate
    >


        <div class="mb-3">

            <label class="form-label">
                Full Name
            </label>

            <input
                type="text"
                th:field="*{name}"
                class="form-control"
                placeholder="Enter your name"
                name="name"
                id="name"
            >

            <div id="nameError" class="error-message"></div>

        </div>



        <div class="mb-3">

            <label class="form-label">
                Email Address
            </label>

            <input
                type="email"
                th:field="*{email}"
                class="form-control"
                placeholder="you@example.com"
                name="email"
                id="email"
            >

            <div id="emailError" class="error-message"></div>

        </div>



        <div class="mb-3">

            <label class="form-label">
                Mobile Number
            </label>

            <input
                type="tel"
                th:field="*{phoneno}"
                class="form-control"
                placeholder="9876543210"
                name="phoneno"
                id="phoneno"
                inputmode="numeric"
            >

            <div id="phonenoError" class="error-message"></div>

        </div>



        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                th:field="*{password}"
                class="form-control"
                placeholder="Create password"
                name="password"
                id="password"
            >

            <div class="password-hint">
                8–25 characters with uppercase, lowercase, number and special character.
            </div>

            <div id="passwordError" class="error-message"></div>

        </div>



        <div class="mb-4">

            <label class="form-label">
                City
            </label>

            <input
                type="text"
                th:field="*{city}"
                class="form-control"
                placeholder="Enter Your City"
                name="city"
                id="city"
            >

            <div id="cityError" class="error-message"></div>

        </div>



        <button
            type="submit"
            class="register-btn"
        >
            Create Account
        </button>

    </form>


    <div class="login-link">

        Already have an account?

        <a href="/login">
            Sign in
        </a>

    </div>

</div>


<script>

function showError(input, errorElement, message) {

    input.classList.add("error");
    input.classList.remove("success");

    errorElement.textContent = message;
    errorElement.style.display = "block";

}


function showSuccess(input, errorElement) {

    input.classList.remove("error");
    input.classList.add("success");

    errorElement.textContent = "";
    errorElement.style.display = "none";

}


function validateForm() {

    var name = document.getElementById("name");
    var email = document.getElementById("email");
    var phoneno = document.getElementById("phoneno");
    var password = document.getElementById("password");
    var city = document.getElementById("city");


    var nameError = document.getElementById("nameError");
    var emailError = document.getElementById("emailError");
    var phonenoError = document.getElementById("phonenoError");
    var passwordError = document.getElementById("passwordError");
    var cityError = document.getElementById("cityError");


    var valid = true;


    /* NAME */

    var namePattern = /^[A-Za-z ]{5,25}$/;

    if (name.value.trim() === "") {

        showError(
            name,
            nameError,
            "Please enter your full name."
        );

        valid = false;

    }
    else if (!namePattern.test(name.value.trim())) {

        showError(
            name,
            nameError,
            "Name must contain only letters and spaces and be 5–25 characters long."
        );

        valid = false;

    }
    else {

        showSuccess(name, nameError);

    }



    /* EMAIL */

    var emailPattern = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

    if (email.value.trim() === "") {

        showError(
            email,
            emailError,
            "Please enter your email address."
        );

        valid = false;

    }
    else if (!emailPattern.test(email.value.trim())) {

        showError(
            email,
            emailError,
            "Please enter a valid email address."
        );

        valid = false;

    }
    else {

        showSuccess(email, emailError);

    }



    /* PHONE */

    var phonenoPattern = /^[0-9]{10}$/;

    if (phoneno.value.trim() === "") {

        showError(
            phoneno,
            phonenoError,
            "Please enter your mobile number."
        );

        valid = false;

    }
    else if (!phonenoPattern.test(phoneno.value.trim())) {

        showError(
            phoneno,
            phonenoError,
            "Mobile number must contain exactly 10 digits."
        );

        valid = false;

    }
    else {

        showSuccess(phoneno, phonenoError);

    }



    /* PASSWORD */

    var passwordPattern =
    	/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?#&])[A-Za-z\d@$!%*?#&]{8,25}$/;

    if (password.value === "") {

        showError(
            password,
            passwordError,
            "Please create a password."
        );

        valid = false;

    }
    else if (!passwordPattern.test(password.value)) {

        showError(
            password,
            passwordError,
            "Password must be 8–25 characters and contain uppercase, lowercase, number and special character."
        );

        valid = false;

    }
    else {

        showSuccess(password, passwordError);

    }



    /* CITY */

    var cityPattern = /^[A-Za-z ]{3,25}$/;

    if (city.value.trim() === "") {

        showError(
            city,
            cityError,
            "Please enter your city."
        );

        valid = false;

    }
    else if (!cityPattern.test(city.value.trim())) {

        showError(
            city,
            cityError,
            "City must contain only letters and spaces and be 3–25 characters long."
        );

        valid = false;

    }
    else {

        showSuccess(city, cityError);

    }


    return valid;

}

</script>

</body>
</html>
