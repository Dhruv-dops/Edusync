<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>My Attendance</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6fb;
}

.card-box{
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 2px 12px rgba(0,0,0,.05);
}

.stat{
    text-align:center;
    padding:20px;
}

.stat h2{
    color:#2563eb;
}

</style>

</head>
<body>

		<div sec:authorize="isAnonymous()">
    <div th:replace="~{fragments/header :: crm-header}"></div>
</div>

<div sec:authorize="isAuthenticated()">
    <div th:replace="~{fragments/header :: user-header}"></div>
</div>

<div class="container mt-5">

    <div class="row mb-4">

        <div class="col-md-4">

            <div class="card-box stat">

                <h2 th:text="${percentage} + '%'">
                </h2>

                <p>Attendance %</p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card-box stat">

                <h2 th:text="${presentCount}">
                </h2>

                <p>Present Days</p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card-box stat">

                <h2 th:text="${totalCount}">
                </h2>

                <p>Total Classes</p>

            </div>

        </div>

    </div>

    <div class="card-box">

        <h4>Attendance History</h4>

        <table class="table mt-3">

            <thead>

            <tr>

                <th>Date</th>
                <th>Course</th>
                <th>Status</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="a : ${attendanceList}">

                <td th:text="${a.date}">
                </td>

                <td th:text="${a.course.name}">
                </td>

                <td>

                    <span class="badge bg-success"
                          th:if="${a.status == 'PRESENT'}">

                        Present

                    </span>

                    <span class="badge bg-danger"
                          th:if="${a.status == 'ABSENT'}">

                        Absent

                    </span>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
