<body>

   <!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details | EduSync</title>


<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

    body{
        background:#f4f7fc;
    }

    .profile-card{
        border:none;
        border-radius:20px;
        overflow:hidden;
    }

    .profile-header{
        background:linear-gradient(135deg,#0d6efd,#3b82f6);
        color:white;
        padding:40px;
    }

    .avatar{
        width:100px;
        height:100px;
        border-radius:50%;
        background:white;
        color:#0d6efd;
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:45px;
        margin:auto;
    }

    .course-card{
        border:none;
        border-radius:18px;
        transition:.3s;
    }

    .course-card:hover{
        transform:translateY(-6px);
    }

    .page-title{
        font-weight:700;
    }

</style>

</head>

<body>

<div class="container py-5">


<!-- Back Button -->

<div class="mb-4">
    <a href="/admin/students"
       class="btn btn-outline-primary">
        <i class="bi bi-arrow-left"></i>
        Back To Students
    </a>
</div>

<!-- Student Profile -->

<div class="row justify-content-center mb-5">

    <div class="col-lg-8">

        <div class="card shadow profile-card">

            <div class="profile-header text-center">

                <div class="avatar">
                    <i class="bi bi-person-fill"></i>
                </div>

                <h2 class="mt-3 fw-bold"
                    th:text="${student.name}">
                </h2>

                <p class="mb-1"
                   th:text="${student.email}">
                </p>
                
                <div style="
    display:inline-block;
    background:white;
    color:#2563eb;
    padding:8px 18px;
    border-radius:20px;
    font-weight:700;
    margin-top:10px;
">

    🆔 Student ID:
    <span th:text="${student.studentId}">
    </span>

</div>

                <span class="badge bg-light text-dark fs-6 mt-2">
                    <i class="bi bi-geo-alt-fill"></i>
                    <span th:text="${student.city}">
                    </span>
                </span>

            </div>

        </div>

    </div>

</div>

<!-- Course Section -->

<div class="text-center mb-4">

    <h2 class="page-title">
        Purchased Courses
    </h2>

    <p class="text-muted">
        Courses purchased by this student
    </p>

</div>

<!-- Course Cards -->

<div class="row">

    <div class="col-lg-4 col-md-6 mb-4"
         th:each="course : ${courses}">

        <div class="card shadow-sm course-card h-100">

            <div class="card-body">

                <h5 class="fw-bold text-primary"
                    th:text="${course.courseName}">
                </h5>

                <hr>

                <p>
                    <i class="bi bi-cash-stack text-success"></i>

                    Amount :
                    <strong>
                        ₹<span th:text="${course.courseAmount}">
                        </span>
                    </strong>
                </p>

                <p>
                    <i class="bi bi-calendar-event text-danger"></i>

                    Purchased On :
                    <span th:text="${course.dateOfPurchase}">
                    </span>
                </p>

            </div>

            <div class="card-footer bg-white border-0">

                <button class="btn btn-primary w-100">
                    Course Purchased
                </button>

            </div>

        </div>

    </div>

</div>

<!-- Empty State -->

<div th:if="${#lists.isEmpty(courses)}">

    <div class="card shadow border-0 p-5 text-center">

        <h1>📚</h1>

        <h3>No Courses Purchased</h3>

        <p class="text-muted">
            This student has not purchased any course yet.
        </p>

    </div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>


</body>
</html>
