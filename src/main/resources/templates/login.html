<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduSync – Sign In</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e2e6ea;
            border-radius: 14px;
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .login-logo-icon {
            width: 36px;
            height: 36px;
            background-color: #0C447C;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-logo-icon svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .login-logo-text {
            font-size: 20px;
            font-weight: 500;
            color: #1a1a2e;
            letter-spacing: 0.3px;
        }

        .login-title {
            font-size: 22px;
            font-weight: 500;
            color: #1a1a2e;
            text-align: center;
            margin-bottom: 6px;
        }

        .login-sub {
            font-size: 13px;
            color: #6c757d;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 500;
            color: #1a1a2e;
            margin-bottom: 6px;
        }

        .form-control {
            height: 42px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            background-color: #f8f9fa;
            color: #1a1a2e;
            padding: 0 14px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .form-control:focus {
            border-color: #378ADD;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(55, 138, 221, 0.12);
            outline: none;
        }

        .form-control::placeholder {
            color: #adb5bd;
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0 24px;
        }

        .form-check-label {
            font-size: 13px;
            color: #6c757d;
        }

        .forgot-link {
            font-size: 13px;
            color: #185FA5;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            height: 44px;
            background-color: rgb(33, 37, 41);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.1s;
        }

        .btn-login:hover {
            background-color: #185FA5;
        }

        .btn-login:active {
            transform: scale(0.99);
        }

        .signup-text {
            text-align: center;
            font-size: 13px;
            color: #6c757d;
            margin-top: 20px;
        }

        .signup-text a {
            color: #185FA5;
            font-weight: 500;
            text-decoration: none;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        .login-error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .form-control.login-invalid {
            border-color: #dc3545;
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.1);
        }

        .server-error {
            font-size: 13px;
            border-radius: 8px;
        }

        .server-success {
            font-size: 13px;
            border-radius: 8px;
        }

    </style>

</head>


<body>

    <div class="login-card">

        <div class="login-logo">

            <div class="login-logo-icon">

                <svg
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <path d="M12 3L2 9l10 6 10-6-10-6z"></path>

                    <path d="M2 17l10 6 10-6"></path>

                    <path d="M2 13l10 6 10-6"></path>

                </svg>

            </div>

            <span class="login-logo-text">
                EduSync
            </span>

        </div>


        <h1 class="login-title">
            Sign in
        </h1>


        <p class="login-sub">
            Enter your credentials to continue
        </p>


        <div
            th:if="${param.error}"
            class="alert alert-danger server-error"
        >
            Invalid email or password.
        </div>


        <div
            th:if="${param.logout}"
            class="alert alert-success server-success"
        >
            You have been logged out successfully.
        </div>


        <form
            th:action="@{/login}"
            method="post"
            onsubmit="return validateLogin()"
            novalidate
        >

            <div class="mb-3">

                <label
                    for="email"
                    class="form-label"
                >
                    Email address
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="username"
                    placeholder="you@example.com"
                >

                <div
                    id="emailError"
                    class="login-error"
                ></div>

            </div>


            <div class="mb-3">

                <label
                    for="password"
                    class="form-label"
                >
                    Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                >

                <div
                    id="passwordError"
                    class="login-error"
                ></div>

            </div>


            <div class="options-row">

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="rememberMe"
                        name="rememberMe"
                    >

                    <label
                        class="form-check-label"
                        for="rememberMe"
                    >
                        Remember me
                    </label>

                </div>


                <a
                    href="/forgot-password"
                    class="forgot-link"
                >
                    Forgot password?
                </a>

            </div>


            <button
                type="submit"
                class="btn-login"
            >
                Sign in
            </button>

        </form>


        <p class="signup-text">

            Don't have an account?

            <a href="/register">
                Sign up
            </a>

        </p>

    </div>


    <script>

        function validateLogin() {

            var email = document.getElementById("email");
            var password = document.getElementById("password");

            var emailError = document.getElementById("emailError");
            var passwordError = document.getElementById("passwordError");

            var valid = true;


            emailError.textContent = "";
            passwordError.textContent = "";

            emailError.style.display = "none";
            passwordError.style.display = "none";

            email.classList.remove("login-invalid");
            password.classList.remove("login-invalid");


            if (email.value.trim() === "") {

                emailError.textContent =
                    "Please enter your email address.";

                emailError.style.display = "block";

                email.classList.add("login-invalid");

                valid = false;

            }
            else {

                var emailPattern =
                    /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

                if (!emailPattern.test(email.value.trim())) {

                    emailError.textContent =
                        "Please enter a valid email address.";

                    emailError.style.display = "block";

                    email.classList.add("login-invalid");

                    valid = false;
                }
            }


            if (password.value.trim() === "") {

                passwordError.textContent =
                    "Please enter your password.";

                passwordError.style.display = "block";

                password.classList.add("login-invalid");

                valid = false;
            }


            return valid;
        }


        document.getElementById("email").addEventListener("input", function () {

            this.classList.remove("login-invalid");

            document.getElementById("emailError").style.display = "none";

        });


        document.getElementById("password").addEventListener("input", function () {

            this.classList.remove("login-invalid");

            document.getElementById("passwordError").style.display = "none";

        });

    </script>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
