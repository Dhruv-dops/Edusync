<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>EduSync - Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f4f6fb;
    font-family:'Nunito',sans-serif;
    min-height:100vh;
}

/* Center Container */

.page-center{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:calc(100vh - 70px);
    padding:40px 16px;
}

/* Card */

.profile-card{
    background:white;
    width:100%;
    max-width:460px;
    border-radius:24px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
    overflow:visible;
    animation:fadeUp .5s ease;
}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Avatar */

.avatar-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:-55px;
    margin-bottom:16px;
}

.avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    background:#2874b8;
    border:5px solid white;
    box-shadow:0 8px 20px rgba(40,116,184,.25);

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    font-size:38px;
    font-weight:700;
}

/* User Info */

.name-block{
    text-align:center;
    padding:10px 24px 20px;
    border-bottom:1px solid #eeeeee;
}

.user-name{
    font-size:30px;
    font-weight:700;
    color:#1e1e2e;
}

.user-tag{
    display:inline-block;
    margin-top:8px;
    background:#eaf3fc;
    color:#2874b8;
    padding:6px 16px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
}

.student-id{
    margin-top:14px;
    display:inline-block;
    background:#eef5ff;
    color:#2874b8;
    padding:8px 18px;
    border-radius:25px;
    font-size:14px;
    font-weight:700;
}

/* Info List */

.info-list{
    padding:25px;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.info-item{
    display:flex;
    align-items:center;
    gap:15px;
}

.info-icon{
    width:50px;
    height:50px;
    border-radius:14px;
    background:#eaf3fc;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:22px;
}

.info-label{
    font-size:11px;
    color:#999;
    font-weight:700;
    letter-spacing:1px;
    margin-bottom:3px;
}

.info-value{
    font-size:16px;
    font-weight:600;
    color:#2d2d2d;
}

/* Footer */

.card-footer{
    margin:0 25px 25px;
    padding:14px 18px;

    background:#f4f8fd;
    border-radius:14px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.member-since{
    font-size:13px;
    color:#999;
}

.status{
    color:#22c55e;
    font-size:13px;
    font-weight:700;

    display:flex;
    align-items:center;
    gap:6px;
}

.status::before{
    content:'';
    width:8px;
    height:8px;
    border-radius:50%;
    background:#22c55e;
}

</style>

</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/header :: user-header}"></div>

<div class="page-center">

    <div class="profile-card">

        <!-- Avatar -->

        <div class="avatar-wrap">

            <div class="avatar"
                 th:text="${#strings.toUpperCase(#strings.substring(loggedUser.name,0,2))}">
                FR
            </div>

        </div>

        <!-- Name -->

        <div class="name-block">

            <div class="user-name"
                 th:text="${loggedUser.name}">
                Franki
            </div>

            <span class="user-tag">
                🎓 STUDENT
            </span>

            <br>

            <div class="student-id">

                🆔 Student ID :
                <span th:text="${loggedUser.studentId}">
                    48291
                </span>

            </div>

        </div>

        <!-- Details -->

        <div class="info-list">

            <div class="info-item">

                <div class="info-icon">
                    📧
                </div>

                <div>

                    <div class="info-label">
                        EMAIL
                    </div>

                    <div class="info-value"
                         th:text="${loggedUser.email}">
                        demo@gmail.com
                    </div>

                </div>

            </div>

            <div class="info-item">

                <div class="info-icon">
                    📱
                </div>

                <div>

                    <div class="info-label">
                        PHONE
                    </div>

                    <div class="info-value"
                         th:text="${loggedUser.phoneno}">
                        9876543210
                    </div>

                </div>

            </div>

            <div class="info-item">

                <div class="info-icon">
                    🏙️
                </div>

                <div>

                    <div class="info-label">
                        CITY
                    </div>

                    <div class="info-value"
                         th:text="${loggedUser.city}">
                        Delhi
                    </div>

                </div>

            </div>

        </div>

        <!-- Footer -->

        <div class="card-footer">

            <span class="member-since">
                Member since 2026
            </span>

            <span class="status">
                Active
            </span>

        </div>

    </div>

</div>

</body>
</html>
