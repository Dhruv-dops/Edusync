<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>My Enrollment - EduSync</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6fb;
}

.page-title{
    font-weight:700;
    color:#212529;
}

.enrollment-card{
    border:none;
    border-radius:18px;
    padding:20px;
    box-shadow:0 4px 20px rgba(0,0,0,0.08);
    overflow:hidden;
}

.table thead{
    background:#212529;
    color:white;
}

.course-badge{
    background:#eef0ff;
    color:#4b4bd6;
    padding:5px 12px;
    border-radius:10px;
    font-size:13px;
}

.empty-state{
    text-align:center;
    padding:80px 20px;
}

.empty-state h4{
    margin-top:20px;
    color:#666;
}

.certificate-btn{
    background:#198754;
    border:none;
    border-radius:10px;
    padding:8px 16px;
    color:white;
    text-decoration:none;
    font-weight:600;
}

.certificate-btn:hover{
    background:#157347;
    color:white;
}

</style>
</head>

<body>

<!-- Navbar -->
<div sec:authorize="isAnonymous()">
    <div th:replace="~{fragments/header :: crm-header}"></div>
</div>

<div sec:authorize="isAuthenticated()">
    <div th:replace="~{fragments/header :: user-header}"></div>
</div>

<div class="container mt-5">

    <div class="text-center mb-4">
        <h1 class="page-title">📚 My Enrollment</h1>
        <p class="text-muted">
            View all courses purchased from EduSync.
        </p>
    </div>

    <!-- No Courses -->
    <div th:if="${#lists.isEmpty(myCourses)}"
         class="empty-state">

        <div style="font-size:80px;">📭</div>

        <h4>No Courses Purchased Yet</h4>

        <p class="text-muted">
            Explore courses and start learning today.
        </p>

        <a href="/"
           class="btn btn-primary">
           Browse Courses
        </a>

    </div>

    <!-- Courses Table -->
    <div th:unless="${#lists.isEmpty(myCourses)}"
         class="card enrollment-card">

        <div class="card-body p-0">

            <table class="table table-hover mb-0">

                <thead>
                    <tr>
                        <th>Course Name</th>
                        <th>Price</th>
                        <th>Purchase Date</th>
                        <th>Payment Id</th>
                        <th>Certificate</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="course : ${myCourses}">

                        <td>
                            <span class="course-badge"
                                  th:text="${course.courseName}">
                                Java Full Stack
                            </span>
                        </td>

                        <td th:text="'₹ ' + ${course.courseAmount}">
                            ₹4999
                        </td>

                        <td th:text="${course.dateOfPurchase}">
                            20-07-2026
                        </td>

                        <td th:text="${course.rzpPayId}">
                            pay_xxxxx
                        </td>

                        <td>

                            <a th:href="@{/certificate-test/{courseName}(courseName=${course.courseName})}"
                               class="certificate-btn">

                                Apply Certificate

                            </a>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
```
