<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Manage Students | EduSync</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
            font-family: 'Segoe UI', sans-serif;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 240px;
            min-height: 100vh;
            background: #1a2744;
            position: fixed;
            top: 0;
            left: 0;
            padding: 30px 0;
            z-index: 1000;
        }

        .sidebar .brand {
            color: white;
            font-size: 20px;
            font-weight: 700;
            padding: 0 24px 30px;
            border-bottom: 1px solid #2d3d6b;
            display: block;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #8a9abf;
            text-decoration: none;
            padding: 13px 24px;
            font-size: 14px;
            font-weight: 500;
            transition: all .3s ease;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #243460;
            color: white;
            border-left: 3px solid #4e7cff;
        }

        .logout-btn {
            position: absolute;
            bottom: 30px;
            width: 100%;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .page-container {
            margin-left: 240px;
            padding: 40px;
        }


        /* =========================
           PAGE HEADER
        ========================= */

        .page-title {
            font-weight: 700;
            color: #1a2744;
            margin-bottom: 5px;
        }

        .page-subtitle {
            color: #8a9abf;
        }


        /* =========================
           TOTAL STUDENTS
        ========================= */

        .student-count {
            background: #4e7cff;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 15px;
        }


        /* =========================
           STUDENT CARD
        ========================= */

        .student-card {
            border: none;
            border-radius: 15px;
            transition: 0.3s;
            overflow: hidden;
        }

        .student-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .student-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #e9f2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
        }

        .card-footer {
            background: white;
            border-top: none;
        }

        .student-id {
            color: #2563eb;
            font-weight: 600;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            .sidebar {
                width: 200px;
            }

            .page-container {
                margin-left: 200px;
                padding: 25px 15px;
            }

            .page-header-row {
                flex-direction: column;
                align-items: flex-start !important;
                gap: 15px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     ADMIN SIDEBAR FRAGMENT
========================= -->

<div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>



<!-- =========================
     MAIN CONTENT
========================= -->

<div class="page-container">


    <!-- PAGE HEADER -->

    <div class="d-flex justify-content-between align-items-center mb-4 page-header-row">

        <div>

            <h2 class="page-title">
                Manage Students
            </h2>

            <p class="page-subtitle mb-0">
                View enrolled students and manage accounts
            </p>

        </div>


        <div>

            <span class="student-count">

                Total Students:

                <span th:text="${students.size()}">
                </span>

            </span>

        </div>

    </div>



    <!-- =========================
         STUDENT CARDS
    ========================= -->

    <div class="row g-4">


        <div class="col-lg-4 col-md-6"
             th:each="student : ${students}">


            <div class="card student-card shadow-sm h-100">


                <!-- CARD BODY -->

                <div class="card-body">


                    <div class="student-icon mb-3">
                        👤
                    </div>


                    <h5 class="fw-bold"
                        th:text="${student.name}">
                    </h5>


                    <p class="mb-2">

                        <strong>Email:</strong>
                        <br>

                        <span th:text="${student.email}">
                        </span>

                    </p>


                    <p>

                        <strong>Student ID:</strong>

                        <span class="student-id"
                              th:text="${student.studentId}">
                        </span>

                    </p>


                    <p class="mb-0">

                        <strong>City:</strong>

                        <span th:text="${student.city}">
                        </span>

                    </p>


                </div>



                <!-- CARD FOOTER -->

                <div class="card-footer">


                    <div class="d-flex gap-2">


                        <a class="btn btn-success btn-sm flex-fill"
                           th:href="@{/admin/student/{id}(id=${student.id})}">

                            View Courses

                        </a>


                        <a class="btn btn-danger btn-sm flex-fill"
                           th:href="@{/admin/deleteStudent/{id}(id=${student.id})}"
                           onclick="return confirm('Delete this student?')">

                            Delete

                        </a>


                    </div>


                </div>


            </div>


        </div>


    </div>



    <!-- =========================
         NO STUDENTS
    ========================= -->

    <div th:if="${#lists.isEmpty(students)}"
         class="text-center mt-5">

        <h4>
            No Students Found
        </h4>

        <p class="text-muted">
            Students will appear here after registration.
        </p>

    </div>


</div>


</body>

</html>
