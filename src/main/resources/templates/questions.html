<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Manage Questions</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
    background: #f4f6fb;
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
}

.main {
    margin-left: 240px;
    padding: 30px;
    min-height: 100vh;
    box-sizing: border-box;
}

.card-box {
    background: white;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
    margin-bottom: 25px;
    box-sizing: border-box;
}

.sidebar {
    width: 240px;
    min-height: 100vh;
    background: #1a2744;
    position: fixed;
    top: 0;
    left: 0;
    padding: 30px 0;
    z-index: 100;
}

.sidebar .brand {
    color: white;
    font-size: 20px;
    font-weight: 700;
    padding: 0 24px 30px;
    border-bottom: 1px solid #2d3d6b;
    display: block;
}

.sidebar a {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #8a9abf;
    text-decoration: none;
    padding: 13px 24px;
    font-size: 14px;
    font-weight: 500;
    transition: all .3s ease;
}

.sidebar a:hover,
.sidebar a.active {
    background: #243460;
    color: white;
    border-left: 3px solid #4e7cff;
}

.logout-btn {
    position: absolute;
    bottom: 30px;
    width: 100%;
}


.form-control,
.form-select {
    border-radius: 10px;
}

.btn {
    border-radius: 8px;
}

</style>

</head>
<body>

<div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

<div class="main">

    <h2 class="mb-4">
        📝 Manage Questions
    </h2>

    <!-- Add Question -->

    <div class="card-box">

        <h5>Add New Question</h5>

        <form action="/admin/saveQuestion"
              method="post">

            <div class="mb-3">

                <label>Course</label>

                <select name="courseName"
                        class="form-control">

                    <option
                    th:each="c : ${courses}"
                    th:value="${c.name}"
                    th:text="${c.name}">
                    </option>

                </select>

            </div>

            <div class="mb-3">

                <label>Question</label>

                <input type="text"
                       name="question"
                       class="form-control">

            </div>

            <div class="mb-3">
                <input type="text"
                       name="optionA"
                       class="form-control"
                       placeholder="Option A">
            </div>

            <div class="mb-3">
                <input type="text"
                       name="optionB"
                       class="form-control"
                       placeholder="Option B">
            </div>

            <div class="mb-3">
                <input type="text"
                       name="optionC"
                       class="form-control"
                       placeholder="Option C">
            </div>

            <div class="mb-3">
                <input type="text"
                       name="optionD"
                       class="form-control"
                       placeholder="Option D">
            </div>

            <div class="mb-3">

                <label>Correct Answer</label>

                <select name="correctAnswer"
                        class="form-control">

                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>

                </select>

            </div>

            <button class="btn btn-primary">
                Save Question
            </button>

        </form>

    </div>

    <!-- Questions Table -->

    <div class="card-box">

        <h5>All Questions</h5>

        <table class="table table-bordered">

            <thead>
                <tr>
                    <th>Course</th>
                    <th>Question</th>
                    <th>Correct Answer</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="q : ${questions}">

                    <td th:text="${q.courseName}"></td>

                    <td th:text="${q.question}"></td>

                    <td th:text="${q.correctAnswer}"></td>

                    <td>

                        <a th:href="@{/admin/deleteQuestion/{id}(id=${q.id})}"
                           class="btn btn-danger btn-sm">

                           Delete

                        </a>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
